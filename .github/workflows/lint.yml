name: Lint

on:
  push:
    branches:
      - main
      - 'portfolio/**'
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n zabbix_auto_migration.sh
          bash -n lib/common.sh
          bash -n scripts/*.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck -x zabbix_auto_migration.sh lib/common.sh scripts/*.sh
